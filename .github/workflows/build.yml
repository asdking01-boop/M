name: Build APK Final

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Web and APK
        run: |
          npm install --legacy-peer-deps || true
          npm run build || true
          mkdir -p /tmp/www
          cp -r dist/* /tmp/www/ 2>/dev/null || cp -r build/* /tmp/www/ 2>/dev/null || cp -r * /tmp/www/ 2>/dev/null || true
          if [ ! -f "/tmp/www/index.html" ]; then echo "<html><body><h1>Kras TV</h1></body></html>" > /tmp/www/index.html; fi
          mkdir -p /tmp/app
          cd /tmp/app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp -r /tmp/www ./www
          echo '{"appId":"com.kras.iptv","appName":"Kras TV","webDir":"www","server":{"androidScheme":"http","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-App-APK
          path: /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk

name: Build IPTV APK (Working Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Web Files
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps --force || true
            npx vite build || npm run build || true
          fi
          mkdir -p /tmp/web_out
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -r dist/* /tmp/web_out/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* /tmp/web_out/
          else
            find . -maxdepth 2 -not -path '*/.*' -not -path './node_modules*' -not -path './android*' -exec cp -r {} /tmp/web_out/ \; 2>/dev/null || true
          fi
          if [ ! -f "/tmp/web_out/index.html" ]; then
            HTML_FILE=$(find /tmp/web_out -name "index.html" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp -r $(dirname "$HTML_

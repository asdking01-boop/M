name: Build IPTV APK (Auto-Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install & Build Web (Bypass Strict Errors)
        run: |
          npm install --legacy-peer-deps
          npx vite build || npm run build

      - name: Configure Capacitor & Sync Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "IPTV App" "com.kras.iptv" --web-dir $WEB_DIR
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
